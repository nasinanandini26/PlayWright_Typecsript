# =====================================================================
# config.properties
# ---------------------------------------------------------------------
# Centralised, environment-style configuration for the framework.
# Read at runtime by utility/DataHandler.ts (ConfigReader, a Singleton)
# so that no page, step definition or hook ever hard-codes a URL,
# credential or timeout value.
#
# In a real project this file (or at least the credential lines) would
# be excluded from version control and injected via CI secrets / a
# local override. It is committed here only because these are the
# public, throwaway demo credentials for https://www.saucedemo.com.
# =====================================================================

# ---- Application under test ----
base.url=https://www.saucedemo.com

# ---- API under test ----
# Base URL for API requests, read by utility/ApiActions.ts. Endpoints passed
# to ApiActions' get/post/put/patch/delete are resolved relative to this, so
# steps only ever deal in paths like "/users/1", never full URLs. SauceDemo
# ships no public API, so this points at a free demo REST API for the
# framework's API examples — swap it for your real service's base URL.
api.base.url=https://jsonplaceholder.typicode.com
# Default timeout (ms) applied to every API request unless overridden per call.
api.timeout.millis=30000

# ---- Browser / execution settings ----
browser=chromium
headless=false
slow.mo.millis=50
default.timeout.millis=30000
viewport.width=1366
viewport.height=768

# ---- Authenticated session reuse (Playwright storage state) ----
# By DEFAULT every scenario reuses a saved browser session — cookies +
# localStorage — from this file instead of logging in through the UI each
# time, so it starts already logged in. The file is generated automatically on
# first use by stepDefinitions/hooks.ts (one real login with valid.username /
# valid.password per run) and then loaded into each scenario's browser context.
# Scenarios tagged @guest (e.g. features/login.feature, which must test the
# login form itself) opt out and start from a clean, logged-out context.
# Path is relative to the project root; the file holds a live session, so it
# is git-ignored (.auth/).
storage.state.path=.auth/storageState.json

# ---- Login credentials (SauceDemo public demo accounts) ----
valid.username=standard_user
valid.password=secret_sauce
locked.username=locked_out_user
performance.username=performance_glitch_user
invalid.password=wrong_password
