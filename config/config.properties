# =====================================================================
# config.properties
# ---------------------------------------------------------------------
# Centralised, environment-style configuration for the framework.
# Read at runtime by utility/DataHandler.ts (ConfigReader, a Singleton)
# so that no page, step definition or hook ever hard-codes a URL,
# credential or timeout value.
#
# In a real project this file (or at least the credential lines) would
# be excluded from version control and injected via CI secrets / a
# local override. It is committed here only because these are the
# public, throwaway demo credentials for https://www.saucedemo.com.
# =====================================================================

# ---- Application under test ----
base.url=https://www.saucedemo.com

# ---- Browser / execution settings ----
browser=chromium
headless=false
slow.mo.millis=50
default.timeout.millis=30000
viewport.width=1366
viewport.height=768

# ---- Login credentials (SauceDemo public demo accounts) ----
valid.username=standard_user
valid.password=secret_sauce
locked.username=locked_out_user
performance.username=performance_glitch_user
invalid.password=wrong_password
